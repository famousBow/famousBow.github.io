<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>html&css 기초</title>
    <style>
      .myclass {
        color: red;
        background-color: beige;
      }
      #myid {
        color: white;
        background-color: black;
      }
    </style>
  </head>
  <body>
    <h1 class="myclass">나는 클래스 해딩태그입니다.</h1>
    <h1 id="myid">나는 아이디 헤딩태그입니다.</h1>
  </body>
</html>
